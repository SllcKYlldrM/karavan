name: Autonomous Content Agent

on:
  schedule:
    # 01:00 Europe/Istanbul (22:00 UTC previous day)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Ajanı Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/agent.py

      - name: Node.js ve pnpm Kurulumu
        uses: pnpm/action-setup@v4
        with:
          version: "10.11.1"

      - name: Node.js Sürümünü Sabitle
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: "pnpm"

      - name: Üretilen İçeriği Build ile Doğrula
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Taslağı Depoya Kaydet
        run: |
          git config --global user.name "AI Content Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git pull origin main --rebase
          git add src/content/posts/ public/images/
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat: otonom icerik ve yerel kapak gorseli eklendi" && git push)
