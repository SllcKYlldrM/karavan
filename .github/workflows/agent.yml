name: Autonomous Content Agent

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Ajanı Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/agent.py

     - name: Taslağı Depoya Kaydet
        run: |
          git config --global user.name "AI Content Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git pull origin main --rebase
          git add src/content/posts/
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat: otonom icerik ve kapak gorseli eklendi" && git push)
