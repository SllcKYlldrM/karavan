name: Autonomous Content Agent

on:
  # Her gün saat 03:00 UTC'de otonom çalışır
  schedule:
    - cron: '0 3 * * *'
  # Panelden istediğin an manuel butonla tetiklemek için:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic

      - name: Ajanı Çalıştır
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/agent.py

      - name: Taslağı Depoya Kaydet
        run: |
          git config --global user.name "AI Content Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add src/content/posts/ scripts/topics.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat: otonom icerik ve kuyruk guncellendi [skip ci]" && git push)
